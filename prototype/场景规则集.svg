<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">同一场景下的多个规则集原型</title>
  <desc id="description">尺寸展开场景下有三个独立规则集，每个都有自己的场景绑定和活动修订。</desc>
  <defs><style>
    text { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; }
    .mono { font-family:'SFMono-Regular',Consolas,monospace; }
    .white { fill:#eef3ff; } .muted { fill:#b8c3d8; } .faint { fill:#8e9cba; } .mint { fill:#75aaff; } .gold { fill:#e8bd79; }
    .tiny { font-size:10px; } .small { font-size:12px; } .body { font-size:13px; } .label { font-size:11px; letter-spacing:1.5px; }
  </style></defs>
  <rect width="1440" height="900" fill="#151b2b"/>
  <rect width="232" height="900" fill="#0c1b3b"/><path d="M232 0v900M232 65h1208" stroke="#3c4965"/>
  <rect x="27" y="25" width="31" height="31" rx="8" fill="#75aaff"/><text x="36" y="47" fill="#0c1b3b" font-size="19" font-weight="700" class="mono">规</text>
  <text x="69" y="39" class="white" font-size="15" font-weight="600">规则管理</text>
  <text x="28" y="107" class="faint label">工作空间</text>
  <rect x="15" y="160" width="202" height="41" rx="10" fill="#2c426c" stroke="#323e5a"/>
  <g fill="none" stroke="#b8c3d8" stroke-width="1.5"><rect x="30" y="126" width="6" height="6" rx="1"/><rect x="41" y="126" width="6" height="6" rx="1"/><rect x="30" y="137" width="6" height="6" rx="1"/><rect x="41" y="137" width="6" height="6" rx="1"/><path d="M30 179h18M30 185h18M30 223h18M30 231h18M30 269h18M39 260v18"/></g>
  <text x="62" y="141" class="muted body">场景</text><text x="62" y="185" class="white body" font-weight="600">规则集</text><text x="190" y="185" class="faint mono tiny">03</text><text x="62" y="229" class="muted body">条件集</text><text x="190" y="229" class="faint mono tiny">02</text><text x="62" y="273" class="muted body">发布记录</text>
  <rect x="21" y="763" width="190" height="109" rx="12" fill="#202a41" stroke="#3c4965"/><text x="38" y="787" class="mint label">当前范围</text><circle cx="42" cy="812" r="3.5" fill="#75aaff"/><text x="53" y="816" class="white small">尺寸展开</text><text x="38" y="839" class="faint tiny">契约版本 2</text>
  <text x="268" y="39" class="muted small">业务应用</text><text x="328" y="39" class="faint small">/</text><text x="343" y="39" class="muted small">规则管理</text><text x="400" y="39" class="faint small">/</text><text x="415" y="39" class="white small">规则集</text>
  
  
  <text x="268" y="158" class="white" font-size="34" font-weight="570" letter-spacing="-2">尺寸展开 · 规则集</text>
  <text x="268" y="187" class="muted body">一个场景可以拥有多个独立规则集。每个规则集分别维护草稿与发布版本，并通过场景绑定参与运行选择。</text>
  <rect x="1284" y="129" width="131" height="37" rx="8" fill="#75aaff"/><text x="1300" y="152" fill="#0c1b3b" font-size="12" font-weight="600">＋ 新建规则集</text>
  <rect x="268" y="220" width="1147" height="75" rx="13" fill="#202b45" stroke="#3c4965"/><path d="M841 220v75" stroke="#3c4965"/>
  <text x="289" y="246" class="faint tiny">当前场景</text><text x="289" y="273" class="white small" font-weight="600">尺寸展开</text>
  <text x="862" y="246" class="faint tiny">场景契约</text><text x="862" y="273" class="white small" font-weight="600">版本 2</text>
  <rect x="268" y="314" width="1147" height="422" rx="13" fill="#292e44" stroke="#3c4965"/>
  <text x="291" y="351" class="white" font-size="18" font-weight="560">场景内规则集</text><text x="291" y="374" class="faint tiny">3 个规则集 · 3 个活动发布修订 · 1 个待完成草稿</text>
  <rect x="1304" y="333" width="88" height="24" rx="5" fill="#38445f"/><text x="1317" y="349" class="muted tiny">按场景筛选</text>
  <rect x="291" y="399" width="1101" height="95" rx="10" fill="#2b344b" stroke="#44516f"/>
  <text x="312" y="423" class="mint mono tiny">SIZE-EXP-01</text><text x="312" y="450" class="white" font-size="15" font-weight="600">尺寸展开规则</text><text x="312" y="474" class="faint tiny">主流程：常规与特殊产品规格计算</text>
  <text x="720" y="427" class="faint tiny">当前绑定范围</text><text x="720" y="454" class="muted small">产品 A / B · 2 项绑定</text>
  <text x="1031" y="427" class="faint tiny">版本</text><rect x="1031" y="441" width="78" height="23" rx="5" fill="#243e6d"/><circle cx="1043" cy="452" r="2.5" fill="#75aaff"/><text x="1052" y="456" class="mint tiny">线上 R03</text><rect x="1116" y="441" width="78" height="23" rx="5" fill="#3f3540"/><circle cx="1128" cy="452" r="2.5" fill="#e8bd79"/><text x="1137" y="456" class="gold tiny">草稿 R04</text>
  <rect x="1270" y="429" width="100" height="35" rx="8" fill="#333c55" stroke="#323e5a"/><text x="1285" y="451" class="white tiny">编辑</text>
  <rect x="291" y="505" width="1101" height="95" rx="10" fill="#2b344b" stroke="#3c4965"/>
  <text x="312" y="529" class="mint mono tiny">SIZE-EXP-LINE</text><text x="312" y="556" class="white" font-size="15" font-weight="600">精整线展开规则</text><text x="312" y="580" class="faint tiny">精整线独立维护的计算范围</text>
  <text x="720" y="533" class="faint tiny">当前绑定范围</text><text x="720" y="560" class="muted small">工艺路线 = 精整 · 产品 C</text>
  <text x="1031" y="533" class="faint tiny">版本</text><rect x="1031" y="547" width="78" height="23" rx="5" fill="#243e6d"/><circle cx="1043" cy="558" r="2.5" fill="#75aaff"/><text x="1052" y="562" class="mint tiny">线上 R02</text>
  <rect x="1270" y="535" width="100" height="35" rx="8" fill="none" stroke="#363e51"/><text x="1285" y="557" class="white tiny">查看</text>
  <rect x="291" y="611" width="1101" height="95" rx="10" fill="#2b344b" stroke="#3c4965"/>
  <text x="312" y="635" class="mint mono tiny">SIZE-EXP-TRIAL</text><text x="312" y="662" class="white" font-size="15" font-weight="600">试验规格规则</text><text x="312" y="686" class="faint tiny">小范围试验规格的计算规则</text>
  <text x="720" y="639" class="faint tiny">当前绑定范围</text><text x="720" y="666" class="muted small">产品 D · 试验工艺</text>
  <text x="1031" y="639" class="faint tiny">版本</text><rect x="1031" y="653" width="78" height="23" rx="5" fill="#243e6d"/><circle cx="1043" cy="664" r="2.5" fill="#75aaff"/><text x="1052" y="668" class="mint tiny">线上 R01</text>
  <rect x="1270" y="641" width="100" height="35" rx="8" fill="none" stroke="#363e51"/><text x="1285" y="663" class="white tiny">查看</text>
  <rect x="268" y="755" width="1147" height="95" rx="10" fill="#232b3e" stroke="#344160"/>
  <text x="289" y="785" class="mint small" font-weight="600">运行选择发生在整个场景内</text>
  <text x="289" y="809" fill="#a8b2c8" font-size="11">运行时检查这 3 个规则集的活动修订及其绑定，选择唯一的最高优先级命中绑定；若最高优先级并列，则返回绑定歧义。</text>
  <text x="289" y="830" fill="#a8b2c8" font-size="11">优先级属于绑定，不属于规则集本身。</text>
</svg>
